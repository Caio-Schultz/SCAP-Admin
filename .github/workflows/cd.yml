name: CD - Deploy to EC2

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/SCAP-Admin
            git fetch origin
            git checkout develop
            git pull origin develop

            cd frontend
            npm ci --no-audit --no-fund
            NODE_OPTIONS=--max-old-space-size=768 npm run build
            cd ..

            cd backend
            npm ci --omit=dev --no-audit --no-fund
            npx prisma generate
            npx prisma migrate deploy
            cd ..

            pm2 restart server --update-env
            sleep 5
            pm2 describe server | grep -q online || { pm2 logs server --err --lines 30 --nostream; exit 1; }
            curl -fsS http://127.0.0.1:3000/ > /dev/null || { echo "Backend nao respondeu"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm ci

      - name: Wait for app
        run: |
          for i in {1..15}; do curl -fs "http://${{ secrets.EC2_HOST }}" > /dev/null && break || sleep 4; done

      - name: Run Selenium Interface Test
        env:
          APP_URL: http://${{ secrets.EC2_HOST }}
        run: |
          cd frontend
          npm run test:selenium