name: Promote develop to main

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'develop'
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify PR and promote to main
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state,baseRefName,headRefOid)"
          state="$(jq -r '.state' <<< "$pr")"
          base="$(jq -r '.baseRefName' <<< "$pr")"
          head="$(jq -r '.headRefOid' <<< "$pr")"

          if [[ "$state" != "OPEN" || "$base" != "develop" || "$head" != "$TESTED_HEAD_SHA" ]]; then
            echo "PR nao esta aberto ou seu commit mudou desde o CI; promocao ignorada."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --merge --match-head-commit "$TESTED_HEAD_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create main origin/main

          for attempt in {1..5}; do
            git fetch origin develop main
            git reset --hard origin/main
            git merge --no-ff --no-edit origin/develop
            if git push origin main; then
              echo "promoted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done

          echo "Falha ao atualizar main apos cinco tentativas."
          exit 1

  deploy:
    needs: promote
    if: needs.promote.outputs.promoted == 'true'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
